    <path d="M150,28 L150,34 M229,107 L223,107 M150,186 L150,180 M71,107 L77,107 M206,51 L201,56 M206,163 L201,158 M94,163 L99,158 M94,51 L99,56" fill="none" stroke="#388E3C" stroke-width="3.5" stroke-linecap="round" />

