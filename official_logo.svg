    <path d="M112,118 L108,98 C94,94 94,68 110,61 C111,48 135,41 150,48 C160,41 184,48 185,61 C201,68 201,94 187,98 L183,118 Z" fill="#FFFFFF" stroke="#1B5E20" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
