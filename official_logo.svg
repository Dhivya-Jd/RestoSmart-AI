    <circle cx="150" cy="81" r="16" fill="#FFFFFF" stroke="#1B5E20" stroke-width="4" />
    <path d="M150,61 L150,65 M150,97 L150,101 M134,81 L130,81 M166,81 L170,81 M139,70 L136,67 M161,92 L164,95 M139,92 L136,95 M161,70 L164,67" fill="none" stroke="#1B5E20" stroke-width="3.5" stroke-linecap="round" />
    <path d="M150,81 L143,74 M150,81 L158,81" fill="none" stroke="#1B5E20" stroke-width="3.5" stroke-linecap="round" />

    <!-- Left Side Gear Wheel Detail -->
    <circle cx="110" cy="128" r="8" fill="#FFFFFF" stroke="#1B5E20" stroke-width="3.5" />
    <path d="M110,117 L110,120 M110,136 L110,139 M102,128 L99,128 M118,128 L121,128 M102,138 L94,146" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round" />

