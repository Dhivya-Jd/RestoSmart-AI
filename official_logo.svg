    <path d="M150,190 C140,168 140,140 150,130 C160,140 160,168 150,190 Z" fill="#2E7D32" />
    <path d="M148,187 C128,178 110,163 106,148 C122,148 142,163 148,187 Z" fill="#388E3C" />
    <path d="M152,187 C172,178 190,163 194,148 C178,148 158,163 152,187 Z" fill="#2E7D32" />

    <!-- TYPOGRAPHY: FOOD WISE -->
    <text x="48" y="250" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="36" fill="#388E3C" letter-spacing="1">FOOD</text>
    <text x="192" y="250" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="36" fill="#0D3B23" letter-spacing="1">WISE</text>

    <!-- SUBTITLE: SMART KITCHEN MANAGEMENT -->
    <text x="150" y="280" font-family="'Arial', 'Helvetica', sans-serif" font-weight="bold" font-size="12" fill="#1B5E20" letter-spacing="2.5" text-anchor="middle">SMART KITCHEN MANAGEMENT</text>
</svg>
